services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: karm
      POSTGRES_PASSWORD: karm
      POSTGRES_DB: karmkaro
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karm -d karmkaro"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "43123:43123"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://karm:karm@db:5432/karmkaro?schema=public
      REDIS_URL: redis://redis:6379
      APP_URL: http://127.0.0.1:43123
      AUTH_URL: http://127.0.0.1:43123
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
